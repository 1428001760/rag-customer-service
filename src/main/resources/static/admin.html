<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客服系统管理后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    .header { background: #1677ff; color: white; padding: 16px; border-radius: 8px; margin-bottom: 20px; font-size: 18px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
    .user-info { font-size: 14px; font-weight: normal; }
    .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-left: 12px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: white; border-radius: 6px; cursor: pointer; }
    .tab.active { background: #1677ff; color: white; }
    .panel { background: white; padding: 20px; border-radius: 8px; display: none; }
    .panel.active { display: block; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #fafafa; font-weight: 500; }
    .btn { padding: 6px 12px; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-primary { background: #1677ff; }
    .btn-danger { background: #ff4d4f; margin-left: 6px; }
    .status-1 { color: #fa8c16; }
    .status-2 { color: #1677ff; }
    .status-3 { color: #52c41a; }
  </style>
</head>
<body>
<div class="header">
  <span>📊 RAG智能客服系统 - 管理后台</span>
  <span class="user-info">
            欢迎，<span id="username"></span>（<span id="roleText"></span>）
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </span>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="order" onclick="switchTab('order', event)">工单管理</div>
  <div class="tab" data-tab="log" onclick="switchTab('log', event)">对话记录</div>
  <div class="tab" data-tab="knowledge" onclick="switchTab('knowledge', event)">知识库管理</div>
</div>

<div id="orderPanel" class="panel active">
  <h3 style="margin-bottom:16px;">工单列表</h3>
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>用户问题</th>
      <th>状态</th>
      <th>创建时间</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody id="orderTable"></tbody>
  </table>
</div>

<div id="logPanel" class="panel">
  <h3 style="margin-bottom:16px;">对话记录</h3>
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>用户问题</th>
      <th>是否命中知识库</th>
      <th>响应耗时</th>
      <th>时间</th>
    </tr>
    </thead>
    <tbody id="logTable"></tbody>
  </table>
</div>

<div id="knowledgePanel" class="panel">
  <h3 style="margin-bottom:16px;">知识库管理</h3>
  <p style="color:#666;line-height:1.8;">
    • 支持 TXT / PDF / DOCX / Markdown 多格式文档上传<br>
    • 文档自动分块、向量化存储至Chroma向量数据库<br>
    • 同名文档自动覆盖更新<br>
    • 上传入口：用户端右侧「知识库上传」模块
  </p>
</div>

<script>
  // ====== 登录鉴权 + 角色权限控制 ======
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
  const username = localStorage.getItem('username');

  // 未登录直接跳登录页
  if (!token) {
    window.location.href = '/login.html';
  }

  // 普通用户不能访问管理后台
  if (role === 'user') {
    alert('无权限访问管理后台');
    window.location.href = '/index.html';
  }

  // 显示用户名和角色
  document.getElementById('username').textContent = username || '管理员';
  const roleMap = {
    'admin': '系统管理员',
    'kb_admin': '知识库管理员',
    'cs_staff': '客服坐席'
  };
  document.getElementById('roleText').textContent = roleMap[role] || '管理员';

  // ========== 角色菜单权限控制 ==========
  const tabAuth = {
    'admin': ['order', 'log', 'knowledge'],       // 管理员：全部功能
    'kb_admin': ['knowledge'],                        // 知识库管理员：只能管知识库
    'cs_staff': ['order', 'log']                      // 客服坐席：只能管工单和对话
  };
  // 隐藏没有权限的标签
  document.querySelectorAll('.tab').forEach(tab => {
    if (!tabAuth[role].includes(tab.dataset.tab)) {
      tab.style.display = 'none';
    }
  });

  // 所有请求自动带token头
  const originalFetch = window.fetch;
  window.fetch = function(url, options = {}) {
    options.headers = { ...options.headers, 'token': token };
    return originalFetch(url, options).then(res => {
      if (res.status === 401) {
        alert('登录已过期，请重新登录');
        localStorage.clear();
        window.location.href = '/login.html';
      }
      return res;
    });
  };

  function logout() {
    localStorage.clear();
    window.location.href = '/login.html';
  }
  // ====== 鉴权结束 ======

  function switchTab(name, event) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(name + 'Panel').classList.add('active');
    if(name === 'order') loadOrders();
    if(name === 'log') loadLogs();
  }

  async function loadOrders() {
    const res = await fetch('/admin/order/list');
    const data = await res.json();
    const statusMap = { 1: '待处理', 2: '处理中', 3: '已完成' };
    const html = data.data.map(item => {
      const canClaim = item.status === 1;
      const canHandle = item.status === 1 || item.status === 2;
      return `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.question}</td>
                    <td class="status-${item.status}">${statusMap[item.status] || '未知'}</td>
                    <td>${item.createTime}</td>
                    <td>
                        ${canClaim ? `<button class="btn btn-primary" onclick="claimOrder(${item.id})">认领</button>` : ''}
                        ${canHandle ? `<button class="btn btn-primary" onclick="handleOrder(${item.id})">处理</button>` : ''}
                        <button class="btn btn-danger" onclick="deleteOrder(${item.id})">删除</button>
                    </td>
                </tr>
            `;
    }).join('');
    document.getElementById('orderTable').innerHTML = html;
  }

  function claimOrder(id) {
    fetch('/admin/order/claim', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `id=${id}&handler=${username}`
    }).then(res => res.json()).then(data => {
      if (data.code === 200) {
        alert('认领成功，请尽快处理');
        loadOrders();
      } else {
        alert(data.message || '认领失败');
      }
    });
  }

  function handleOrder(id) {
    const reply = prompt('请输入处理回复：');
    if(!reply) return;
    fetch('/admin/order/handle', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `id=${id}&handler=${username}&reply=${encodeURIComponent(reply)}`
    }).then(res => res.json()).then(data => {
      if (data.code === 200) {
        alert('处理成功');
        loadOrders();
      } else {
        alert(data.message || '处理失败');
      }
    });
  }

  function deleteOrder(id) {
    if(!confirm('确定删除该工单吗？删除后无法恢复')) return;
    fetch('/admin/order/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `id=${id}`
    }).then(res => res.json()).then(data => {
      alert('删除成功');
      loadOrders();
    });
  }

  async function loadLogs() {
    const res = await fetch('/admin/log/list');
    const data = await res.json();
    const html = data.data.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.question}</td>
                    <td>${item.isHit === 1 ? '✅ 命中' : '❌ 未命中'}</td>
                    <td>${item.duration}ms</td>
                    <td>${item.createTime}</td>
                </tr>
            `).join('');
    document.getElementById('logTable').innerHTML = html;
  }

  // 页面加载默认显示第一个有权限的标签
  const firstTab = tabAuth[role][0];
  document.querySelector(`[data-tab="${firstTab}"]`).click();
</script>
</body>
</html>
